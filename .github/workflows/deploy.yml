name: Build, Test, and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: overpower-deckbuilder
  EC2_INSTANCE_ID: i-04493611b99785f28

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run linting
      run: npx eslint src --ext .ts --max-warnings 0

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  knip:
    name: Knip (unused code scan)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Knip (unused code scan)
      run: npx knip --production

  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests (shard ${{ matrix.shard }}/4)
      run: npx jest --config tests/config/jest.ci.config.js --coverage --shard=${{ matrix.shard }}/4
      timeout-minutes: 10

    - name: Upload coverage to Codecov (shard ${{ matrix.shard }})
      if: success()
      uses: codecov/codecov-action@v3
      with:
        directory: coverage/unit/
        flags: unit-shard-${{ matrix.shard }}
        fail_ci_if_error: false

  semgrep:
    name: Semgrep (SQL injection patterns)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Semgrep
      run: python -m pip install --upgrade pip semgrep

    - name: Semgrep scan (human-readable)
      run: semgrep scan --config .semgrep.yml src tests --exclude src/resources --error

    - name: Semgrep scan (JSON artifact)
      if: always()
      run: semgrep scan --config .semgrep.yml src tests --exclude src/resources --json --output semgrep.json || true

    - name: Upload Semgrep report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep.json

  soc2-compliance:
    name: SOC 2 Compliance Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run gitleaks (secret detection)
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: false
      env:
        GITLEAKS_LICENSE: ''

    - name: Run SOC 2 technical compliance checks
      run: bash scripts/soc2-compliance-checks.sh

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Run Trivy vulnerability scanner
      run: |
        echo "🔍 Running Trivy with ignorefile: .trivyignore"
        echo "📋 Contents of .trivyignore:"
        cat .trivyignore
        echo ""
        echo "🚀 Starting scan..."
        trivy fs \
          --ignorefile .trivyignore \
          --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
          --exit-code 1 \
          --ignore-unfixed \
          --scanners vuln \
          .

    - name: Run Trivy (JSON artifact)
      if: always()
      run: |
        trivy fs \
          --ignorefile .trivyignore \
          --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
          --ignore-unfixed \
          --scanners vuln \
          --format json \
          --output trivy-report.json \
          . || true

    - name: Upload Trivy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-report.json

  # Integration Tests - Matrix (consolidated like unit-tests)
  integration-tests:
    name: ${{ matrix.category }}
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: Security
            slug: security
            script: test:integration:security
            args: ""
            timeout: 25
          - category: AuthZ Security
            slug: authz-security
            script: test:integration
            args: "tests/integration/security/session-impersonation-security.test.ts tests/integration/security/debug-endpoints-access.test.ts tests/integration/security/cross-user-mutation-attempts.test.ts"
            timeout: 20
          - category: Authentication
            slug: auth
            script: test:integration
            args: "tests/integration/bcrypt-authentication.test.ts tests/integration/authentication*.test.ts tests/integration/auth-*.test.ts"
            timeout: 15
          - category: Guest
            slug: guest
            script: test:integration
            args: "tests/integration/guest-deck-editing.test.ts tests/integration/guest-read-only-layout-integration.test.ts tests/integration/guest-add-to-deck-buttons.test.ts tests/integration/guest-deck-deletion.test.ts tests/integration/guestLogin.test.ts tests/integration/autoGuestLogin.test.ts"
            timeout: 15
          - category: Search
            slug: search
            script: test:integration
            args: "tests/integration/deck-editor-search-bar-basic.test.ts tests/integration/deck-editor-search-visible-results.test.ts tests/integration/deck-editor-search-results-visible.test.ts tests/integration/search-functionality-integration.test.ts tests/integration/ally-search-integration.test.ts"
            timeout: 15
          - category: Filtering
            slug: filtering
            script: test:integration
            args: "tests/integration/stat-type-filtering-integration.test.ts tests/integration/stat-type-filtering-time-traveler.test.ts tests/integration/stat-type-filtering-john-carter.test.ts tests/integration/power-card-filtering-time-traveler.test.ts tests/integration/power-card-filtering-john-carter.test.ts"
            timeout: 15
          - category: Deck Building & Management
            slug: deck-building
            script: test:integration
            args: "tests/integration/deckBuilding.test.ts tests/integration/deckManagement.test.ts tests/integration/deck-navigation-flow.test.ts tests/integration/deck-editor-search-new-deck.test.ts tests/integration/deckClickability.test.ts tests/integration/limitedDeckIntegration.test.ts tests/integration/limitedDeckSaveAndLoad.test.ts tests/integration/limitedDeckSimpleIntegration.test.ts"
            timeout: 15
          - category: Deck Editing & Validation
            slug: deck-editing
            script: test:integration
            args: "tests/integration/deckEditabilityBrowser.test.ts tests/integration/deckEditabilityHTML.test.ts tests/integration/deckTitleDescriptionEditability.test.ts tests/integration/deck-validation-unusable-cards.test.ts"
            timeout: 15
          - category: Deck Security Ownership
            slug: deck-security-ownership
            script: test:integration:deck-security-ownership
            args: ""
            timeout: 10
          - category: Deck Security Save
            slug: deck-security-save
            script: test:integration:deck-security-save
            args: ""
            timeout: 10
          - category: Deck Security Frontend
            slug: deck-security-frontend
            script: test:integration:deck-security-frontend
            args: ""
            timeout: 10
          - category: Game Logic Character Validation
            slug: game-logic-character-validation
            script: test:integration:game-logic-character-validation
            args: ""
            timeout: 15
          - category: Game Logic Character Layout
            slug: game-logic-character-layout
            script: test:integration:game-logic-character-layout
            args: ""
            timeout: 15
          - category: Game Logic Character Threat
            slug: game-logic-character-threat
            script: test:integration:game-logic-character-threat
            args: ""
            timeout: 15
          - category: Reserve
            slug: reserve
            script: test:integration
            args: "tests/integration/reserve-character-integration.test.ts tests/integration/reserve-character-loading-integration.test.ts tests/integration/reserve-character-simple.test.ts tests/integration/reserve-character-threat-integration.test.ts tests/integration/reserve-character-threat-persistence.test.ts tests/integration/guest-reserve-character-integration.test.ts"
            timeout: 15
          - category: Game Logic Power & Teamwork
            slug: game-logic-power-teamwork
            script: test:integration:game-logic-power-teamwork
            args: ""
            timeout: 10
          - category: UI/UX & Frontend
            slug: ui
            script: test:integration
            args: "tests/integration/*HTML*.test.ts tests/integration/*Browser*.test.ts tests/integration/*Clickability*.test.ts tests/integration/*Editability*.test.ts tests/integration/*Layout*.test.ts tests/integration/*Navigation*.test.ts tests/integration/*Tooltip*.test.ts tests/integration/toast-notification-role-based.test.ts tests/integration/global-nav-integration.test.ts tests/integration/view-button-readonly.test.ts"
            timeout: 15
          - category: User Management
            slug: user-management
            script: test:integration
            args: "tests/integration/create*.test.ts tests/integration/user*.test.ts tests/integration/cross*.test.ts tests/integration/change*.test.ts tests/integration/username*.test.ts"
            timeout: 15
          - category: Collection
            slug: collection
            script: test:integration
            args: "tests/integration/collection/collection-workflow.test.ts tests/integration/collection/collection-api-endpoints.test.ts tests/integration/collection/collection-database-persistence.test.ts tests/integration/collection/collection-cross-user-isolation.test.ts tests/integration/collection/collection-sql-injection-hardening.test.ts tests/integration/collection/collection-admin-access.test.ts tests/integration/collection/collection-error-handling.test.ts"
            timeout: 20
          - category: Remaining
            slug: remaining
            script: test:integration
            args: "tests/integration/new*.test.ts tests/integration/auto*.test.ts tests/integration/database*.test.ts tests/integration/alternate*.test.ts tests/integration/card-duplication-bug.test.ts"
            timeout: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: overpower
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1337:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 60s bash -c 'until pg_isready -h localhost -p 1337 -U postgres; do sleep 1; done'
        echo "PostgreSQL is ready!"

    - name: Cache Flyway
      id: flyway-cache
      uses: actions/cache@v4
      with:
        path: /opt/flyway
        key: flyway-9.22.3-linux-x64

    - name: Install Flyway
      if: steps.flyway-cache.outputs.cache-hit != 'true'
      run: |
        echo "Installing Flyway..."
        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.3/flyway-commandline-9.22.3-linux-x64.tar.gz -o flyway.tar.gz
        tar -xzf flyway.tar.gz
        sudo mv flyway-9.22.3 /opt/flyway
        sudo chmod +x /opt/flyway/flyway
        echo "✅ Flyway installed successfully!"

    - name: Add Flyway to PATH
      run: |
        echo "/opt/flyway" >> $GITHUB_PATH
        /opt/flyway/flyway --version

    - name: Run database migrations
      run: |
        export DATABASE_URL="postgresql://postgres:password@localhost:1337/overpower"
        /opt/flyway/flyway --version
        npm run migrate

    - name: Run ${{ matrix.category }} Integration Tests
      run: |
        echo "Running ${{ matrix.category }} Integration Tests..."
        if [ -z "${{ matrix.args }}" ]; then
          npm run ${{ matrix.script }} -- \
            --verbose --testTimeout=60000 --maxWorkers=2 2>&1 | tee ${{ matrix.slug }}-test-output.log || {
            echo "❌ ${{ matrix.category }} tests failed, checking output..."
            cat ${{ matrix.slug }}-test-output.log | tail -100
            exit 1
          }
        else
          npm run ${{ matrix.script }} -- \
            ${{ matrix.args }} \
            --verbose --testTimeout=60000 --maxWorkers=2 2>&1 | tee ${{ matrix.slug }}-test-output.log || {
            echo "❌ ${{ matrix.category }} tests failed, checking output..."
            cat ${{ matrix.slug }}-test-output.log | tail -100
            exit 1
          }
        fi
        echo "✅ ${{ matrix.category }} tests completed successfully!"
      timeout-minutes: ${{ matrix.timeout }}
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:1337/overpower

  build-docker:
    name: Build & Push Docker Image
    needs: [build, unit-tests, knip, semgrep, trivy, soc2-compliance, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to ensure we have the latest commit

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Generate card image thumbnails
      run: npm run generate:thumbnails

    - name: Verify Git Information
      run: |
        echo "🔍 VERIFYING GIT INFORMATION:"
        echo "Current branch: $(git branch --show-current)"
        echo "Current commit SHA: $(git rev-parse HEAD)"
        echo "Expected commit SHA: ${{ github.sha }}"
        echo "Commit message: $(git log -1 --pretty=format:'%s')"
        echo "Commit author: $(git log -1 --pretty=format:'%an <%ae>')"
        echo "Commit date: $(git log -1 --pretty=format:'%ad')"
        echo "Files changed in this commit:"
        git diff --name-only HEAD~1 HEAD || echo "No previous commit to compare"
        echo "🔍 Checking if key files are present in the current commit:"
        if grep -q "replaceAllCardsInDeck" src/database/PostgreSQLDeckRepository.ts; then
          echo "✅ Card duplication bug fix found in current commit"
        else
          echo "❌ Card duplication bug fix NOT found in current commit"
        fi
        if test -f public/index.html; then
          echo "✅ Main index.html file found in current commit"
        else
          echo "❌ Main index.html file NOT found in current commit"
        fi
        echo "=== END GIT VERIFICATION ==="
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        DOCKER_BUILDKIT: 1
      run: |
        echo "🚀 Starting Docker build with layer caching..."
        echo "🔍 PRE-BUILD VERIFICATION:"
        echo "Building from commit: $(git rev-parse HEAD)"
        echo "Building from branch: $(git branch --show-current)"
        echo "Git commit message: $(git log -1 --pretty=format:'%s')"
        echo "Git commit author: $(git log -1 --pretty=format:'%an <%ae>')"
        echo "Git commit date: $(git log -1 --pretty=format:'%ad')"
        echo "Checking source files before build:"
        if grep -q "replaceAllCardsInDeck" src/database/PostgreSQLDeckRepository.ts; then
          echo "✅ Card duplication bug fix found in source files"
        else
          echo "❌ Card duplication bug fix NOT found in source files"
          exit 1
        fi
        if test -f public/index.html; then
          echo "✅ Main index.html file found in source files"
        else
          echo "❌ Main index.html file NOT found in source files"
          exit 1
        fi
        
        BUILD_TIMESTAMP=$(date +%s)
        docker build --platform linux/amd64 \
          --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg GIT_COMMIT="${{ github.sha }}" \
          --build-arg GIT_SHORT_COMMIT="$(git rev-parse --short HEAD)" \
          --build-arg GIT_BRANCH="$(git branch --show-current)" \
          --build-arg GIT_COMMIT_DATE="$(git log -1 --format=%ci)" \
          --build-arg GIT_COMMIT_MESSAGE="$(git log -1 --format=%s)" \
          --build-arg GIT_COMMIT_AUTHOR="$(git log -1 --format=%an)" \
          --build-arg GIT_COMMIT_EMAIL="$(git log -1 --format=%ae)" \
          --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        echo "✅ Docker build completed"
        
        echo "🏷️ Tagging image..."
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "✅ Image tagged"
        
        echo "📋 Verifying build contents..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ls -la /app/public/index.html
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG grep -c "replaceAllCardsInDeck" /app/src/database/PostgreSQLDeckRepository.ts || echo "0"
        
        echo "🔍 Verifying git information in container..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG sh -c 'echo "Git commit: $GIT_COMMIT"; echo "Git short: $GIT_SHORT_COMMIT"; echo "Git branch: $GIT_BRANCH"; echo "Build timestamp: $BUILD_TIMESTAMP"'
        
        echo "🔍 Verifying API routes exist..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG grep -c "PUT.*decks.*cards" /app/dist/index.js || echo "0"
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG grep -c "replaceAllCardsInDeck" /app/dist/index.js || echo "0"
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Verify Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔍 Verifying critical files in Docker image..."
        echo "Image built: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        
        echo "Testing js directory..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ls -la /app/public/js/; then
          echo "✅ js directory found"
        else
          echo "❌ js directory missing"
        fi
        
        echo "Testing auth-service.js file..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG test -f /app/public/js/auth-service.js; then
          echo "✅ auth-service.js found"
        else
          echo "❌ auth-service.js missing"
        fi
        
        echo "Testing index.html file..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG test -f /app/public/index.html; then
          echo "✅ index.html found"
        else
          echo "❌ index.html missing"
        fi
        
        echo "Checking for card duplication bug fix..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG grep -q "replaceAllCardsInDeck" /app/src/database/PostgreSQLDeckRepository.ts; then
          echo "✅ Card duplication bug fix found in deployment"
        else
          echo "❌ Card duplication bug fix NOT found in deployment - deployment may be using old code"
        fi
        
        echo "Checking for refactored JavaScript files..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG test -d /app/public/js; then
          echo "✅ Refactored JavaScript directory found"
        else
          echo "❌ Refactored JavaScript directory NOT found"
        fi
        
        echo "Listing public directory..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ls -la /app/public/; then
          echo "✅ public directory listing successful"
        else
          echo "❌ public directory listing failed"
        fi

    - name: Push Docker Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "📤 Pushing images to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "✅ Images pushed to ECR"

  run-migrations:
    name: Run Production Migrations
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Create environment file on EC2
      run: |
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "mkdir -p /opt/app",
            "rm -f /opt/app/.env",
            "echo DATABASE_URL=postgresql://postgres:TempPassword123!@op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require > /opt/app/.env",
            "echo DB_HOST=op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com >> /opt/app/.env",
            "echo DB_PORT=5432 >> /opt/app/.env",
            "echo DB_NAME=overpower >> /opt/app/.env",
            "echo DB_USER=postgres >> /opt/app/.env",
            "echo DB_PASSWORD=TempPassword123! >> /opt/app/.env",
            "echo DB_USERNAME=postgres >> /opt/app/.env",
            "echo NODE_ENV=production >> /opt/app/.env",
            "echo PORT=3000 >> /opt/app/.env",
            "echo NODE_TLS_REJECT_UNAUTHORIZED=0 >> /opt/app/.env",
            "echo FLYWAY_URL=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require >> /opt/app/.env",
            "echo FLYWAY_USER=postgres >> /opt/app/.env",
            "echo FLYWAY_PASSWORD=TempPassword123! >> /opt/app/.env"
          ]' \
          --output text --query 'Command.CommandId'

    - name: Append Firebase config to .env
      run: |
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://.github/scripts/append-firebase-env.json \
          --output text --query 'Command.CommandId'

    - name: Append CDN_BASE_URL to .env
      run: |
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "CDN_BASE_URL=$(aws ssm get-parameter --name /op-deckbuilder/dev/app/cdn_base_url --region us-west-2 --query Parameter.Value --output text 2>/dev/null || echo \"\")",
            "if [ -n \"$CDN_BASE_URL\" ]; then echo \"CDN_BASE_URL=$CDN_BASE_URL\" >> /opt/app/.env && echo \"CDN_BASE_URL appended to .env\"; else echo \"CDN_BASE_URL not set in SSM, skipping\"; fi"
          ]' \
          --output text --query 'Command.CommandId'

    - name: Copy Flyway configuration to EC2
      run: |
        echo "📋 Copying Flyway configuration to EC2..."
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "mkdir -p /opt/app",
            "cat > /opt/app/flyway.conf << \"EOF\"",
            "flyway.url=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require",
            "flyway.user=postgres",
            "flyway.password=TempPassword123!",
            "flyway.schemas=public",
            "flyway.locations=filesystem:migrations",
            "flyway.baselineOnMigrate=true",
            "flyway.validateOnMigrate=true",
            "flyway.cleanDisabled=false",
            "flyway.baselineVersion=0",
            "flyway.baselineDescription=Initial baseline",
            "EOF",
            "echo \"✅ Flyway configuration created\""
          ]' \
          --output text --query 'Command.CommandId'
          
    - name: Wait for environment file creation
      run: sleep 10

    - name: Run Production Database Migrations
      run: |
        echo "🔄 Running production database migrations..."
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "cd /opt/app",
            "export DATABASE_URL=\"postgresql://postgres:TempPassword123!@op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require\"",
            "export FLYWAY_URL=\"jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require\"",
            "export FLYWAY_USER=\"postgres\"",
            "export FLYWAY_PASSWORD=\"TempPassword123!\"",
            "echo \"🔄 Installing Flyway...\"",
            "npm install -g flyway",
            "echo \"🔄 Running database migrations...\"",
            "flyway -configFiles=/opt/app/flyway.conf migrate",
            "MIGRATION_EXIT_CODE=$?",
            "if [ $MIGRATION_EXIT_CODE -eq 0 ]; then",
            "  echo \"✅ Production database migrations completed successfully (exit code: $MIGRATION_EXIT_CODE)\"",
            "else",
            "  echo \"❌ Production database migrations FAILED with exit code $MIGRATION_EXIT_CODE\"",
            "  exit $MIGRATION_EXIT_CODE",
            "fi"
          ]' \
          --output text --query 'Command.CommandId'
        
        echo "✅ Migration command sent successfully"
        echo "⏳ Waiting 30 seconds for migration to complete..."
        sleep 30
        echo "✅ Migration step completed - proceeding with deployment"

    - name: Verify Migration Results
      run: |
        echo "🔍 Verifying migration results..."
        aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "cd /opt/app",
            "export FLYWAY_URL=\"jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require\"",
            "export FLYWAY_USER=\"postgres\"",
            "export FLYWAY_PASSWORD=\"TempPassword123!\"",
            "echo \"🔍 Checking migration status...\"",
            "flyway -configFiles=/opt/app/flyway.conf info",
            "echo \"\"",
            "echo \"🔍 Verifying database connection and schema...\"",
            "flyway -configFiles=/opt/app/flyway.conf validate",
            "VALIDATION_EXIT_CODE=$?",
            "if [ $VALIDATION_EXIT_CODE -eq 0 ]; then",
            "  echo \"✅ Database validation successful\"",
            "else",
            "  echo \"❌ Database validation failed with exit code $VALIDATION_EXIT_CODE\"",
            "  exit $VALIDATION_EXIT_CODE",
            "fi"
          ]' \
          --output text --query 'Command.CommandId'
        
        echo "✅ Verification command sent successfully"
        echo "⏳ Waiting 20 seconds for verification to complete..."
        sleep 20
        echo "✅ Database verification completed - proceeding with deployment"

  deploy:
    name: Deploy to Production
    needs: [run-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy-${{ github.ref }}
      cancel-in-progress: false
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Blue-Green Deploy
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        ECR_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
        EXPECTED_COMMIT="$IMAGE_TAG"
        echo "Sending blue-green deploy command (fire-and-forget)..."
        echo "ECR URI: $ECR_URI"
        echo "Deploying image tag: $IMAGE_TAG"

        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 540 \
          --parameters "commands=[
            \"echo '=== Blue-Green Deploy Start ===' \",
            \"CURRENT_PORT=\$(cat /opt/app/active_port 2>/dev/null || echo '3000')\",
            \"if [ \\\"\$CURRENT_PORT\\\" = \\\"3000\\\" ]; then NEW_PORT=3001; else NEW_PORT=3000; fi\",
            \"echo \\\"Switching: port \$CURRENT_PORT -> \$NEW_PORT\\\"\",
            \"echo '--- Step 1: Pull new image ---'\",
            \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URI\",
            \"docker pull $ECR_URI:$IMAGE_TAG\",
            \"echo 'Image pulled.'\",
            \"docker image inspect $ECR_URI:$IMAGE_TAG --format '{{index .RepoDigests 0}}' || true\",
            \"echo '--- Step 2: Start new container on idle port ---'\",
            \"docker stop overpower-app-new || true\",
            \"docker rm overpower-app-new || true\",
            \"docker run -d --name overpower-app-new --restart unless-stopped -p \$NEW_PORT:3000 --env-file /opt/app/.env -e SKIP_MIGRATIONS=true $ECR_URI:$IMAGE_TAG\",
            \"docker inspect overpower-app-new --format '{{.Image}}' || true\",
            \"echo \\\"New container started on port \$NEW_PORT\\\"\",
            \"echo '--- Step 3: Health check new container ---'\",
            \"echo 'Waiting 30s for container to start before first health check...'\",
            \"sleep 30\",
            \"MAX_ATTEMPTS=36\",
            \"ATTEMPT=0\",
            \"PASSED=0\",
            \"while [ \$ATTEMPT -lt \$MAX_ATTEMPTS ]; do\",
            \"  ATTEMPT=\$((ATTEMPT + 1))\",
            \"  HTTP_CODE=\$(curl -s -o /tmp/new_health.json -w '%{http_code}' http://localhost:\$NEW_PORT/health 2>/dev/null || echo '000')\",
            \"  if [ \\\"\$HTTP_CODE\\\" = \\\"200\\\" ]; then\",
            \"    APP_STATUS=\$(cat /tmp/new_health.json | jq -r '.status' 2>/dev/null || echo 'unknown')\",
            \"    DB_STATUS=\$(cat /tmp/new_health.json | jq -r '.database.status' 2>/dev/null || echo 'unknown')\",
            \"    echo \\\"Attempt \$ATTEMPT/\$MAX_ATTEMPTS: HTTP \$HTTP_CODE | app=\$APP_STATUS db=\$DB_STATUS\\\"\",
            \"    if [ \\\"\$APP_STATUS\\\" = \\\"OK\\\" ] && [ \\\"\$DB_STATUS\\\" = \\\"OK\\\" ]; then\",
            \"      PASSED=1\",
            \"      break\",
            \"    fi\",
            \"  else\",
            \"    echo \\\"Attempt \$ATTEMPT/\$MAX_ATTEMPTS: HTTP \$HTTP_CODE - waiting...\\\"\",
            \"  fi\",
            \"  sleep 5\",
            \"done\",
            \"if [ \$PASSED -ne 1 ]; then\",
            \"  echo 'Health check timed out - rolling back'\",
            \"  docker logs overpower-app-new --tail 30 || true\",
            \"  docker stop overpower-app-new || true\",
            \"  docker rm overpower-app-new || true\",
            \"  echo \\\"Old container still serving on port \$CURRENT_PORT\\\"\",
            \"  exit 1\",
            \"fi\",
            \"echo 'New container is healthy'\",
            \"NEW_COMMIT=\$(cat /tmp/new_health.json | jq -r '.git.commit // \\\"\\\"' 2>/dev/null || echo '')\",
            \"echo \\\"New container health commit: \${NEW_COMMIT:-unknown}\\\"\",
            \"echo \\\"Expected commit: $IMAGE_TAG\\\"\",
            \"echo '--- Step 4: Switch nginx traffic ---'\",
            \"sed -i \\\"s/localhost:\$CURRENT_PORT/localhost:\$NEW_PORT/g\\\" /etc/nginx/conf.d/excelsior.cards.conf\",
            \"nginx -t\",
            \"nginx -s reload\",
            \"echo \\\"Traffic switched to port \$NEW_PORT\\\"\",
            \"echo '--- Step 5: Finalize ---'\",
            \"docker stop overpower-app || true\",
            \"docker rm overpower-app || true\",
            \"docker rename overpower-app-new overpower-app\",
            \"echo \$NEW_PORT > /opt/app/active_port\",
            \"docker exec overpower-app flyway -url=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations repair || true\",
            \"docker exec overpower-app flyway -url=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations migrate\",
            \"docker image prune -af || true\",
            \"echo \\\"Active port: \$(cat /opt/app/active_port)\\\"\",
            \"docker ps\",
            \"echo '=== Blue-Green Deploy Complete ==='\"
          ]" \
          --output text --query 'Command.CommandId')

        echo "SSM Command ID: $CMD_ID"
        echo "Polling SSM command status (max 450s)..."
        for i in $(seq 1 90); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id ${{ env.EC2_INSTANCE_ID }} \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "[$i/90] Deploy status: $STATUS"
          [ "$STATUS" = "Success" ] && break
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command ended with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE_ID }} \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 5
        done
        echo "Deploy polling complete."

    - name: Verify Deployment
      run: |
        echo "Verifying deployment via production health endpoint..."
        EXPECTED_COMMIT="${{ github.sha }}"
        echo "Expected commit: $EXPECTED_COMMIT"
        echo "Expected image tag: $EXPECTED_COMMIT"

        # Allow time for nginx/cache to serve the new container after SSM reports Success
        echo "Waiting 25s for traffic to switch to new container..."
        sleep 25

        SUCCESS=0
        DEPLOYED_COMMIT=""
        HTTP_STATUS=""
        LAST_HEALTH=""
        for i in $(seq 1 20); do
          CACHE_BUSTER=$(date +%s%N)
          HEALTH_URL="http://excelsior.cards/health?cb=$CACHE_BUSTER"
          HEALTH=$(curl -s --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$HEALTH_URL" 2>/dev/null || echo "")
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$HEALTH_URL" 2>/dev/null || echo "000")
          DEPLOYED_COMMIT=$(echo "$HEALTH" | jq -r '.git.commit // ""' 2>/dev/null || echo "")
          LAST_HEALTH="$HEALTH"

          echo "[$i/20] HTTP: $HTTP_STATUS | deployed: ${DEPLOYED_COMMIT:-none} | expected: $EXPECTED_COMMIT"

          if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
            echo "Deployment verified: commit $DEPLOYED_COMMIT is live on production"
            SUCCESS=1
            break
          fi

          sleep 10
        done

        if [ $SUCCESS -ne 1 ]; then
          echo "Deployment verification failed"
          echo "Production is running: ${DEPLOYED_COMMIT:-unknown}"
          echo "Expected: $EXPECTED_COMMIT"
          echo "Last HTTP status: ${HTTP_STATUS:-unknown}"
          echo "Last health URL: ${HEALTH_URL:-unknown}"
          echo "Last health response (first 500 chars):"
          echo "$LAST_HEALTH" | head -c 500
          echo ""
          echo "Collecting EC2 deployment diagnostics..."
          DIAG_CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo Active port: $(cat /opt/app/active_port 2>/dev/null || echo unknown)",
              "echo Nginx upstream: $(grep -o \"localhost:[0-9]*\" /etc/nginx/conf.d/excelsior.cards.conf | head -1)",
              "docker ps --format \"table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\""
            ]' \
            --output text --query 'Command.CommandId' 2>/dev/null || echo "")
          if [ -n "$DIAG_CMD_ID" ]; then
            sleep 8
            aws ssm get-command-invocation \
              --command-id "$DIAG_CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE_ID }} \
              --query 'StandardOutputContent' --output text || true
          fi
          echo "If the deploy actually succeeded, production may be on the new commit but verification hit DNS/cache. Check EC2 container and nginx. Otherwise check SSM/CloudWatch for the blue-green deploy step."
          exit 1
        fi

    - name: Deployment success notification
      run: |
        echo "Deployment completed and verified!"
        echo "Application URL: http://excelsior.cards"
        echo "Deployed commit: ${{ github.sha }}"

  post-production:
    name: Post Production
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
        
    - name: Call health check endpoint
      run: |
        echo "🏥 Calling health check endpoint on production server..."
        echo "=========================================="
        
        # Wait a bit for server to be fully ready after deployment
        echo "⏳ Waiting 15 seconds for server to be fully ready..."
        sleep 15
        
        MAX_RETRIES=3
        RETRY_DELAY=30
        ATTEMPT=0
        SUCCESS=0
        
        while [ $ATTEMPT -le $MAX_RETRIES ]; do
          if [ $ATTEMPT -gt 0 ]; then
            echo "⏳ Retry attempt $ATTEMPT of $MAX_RETRIES after waiting $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          fi
          
          echo "🔎 Health check attempt $((ATTEMPT+1))..."
          HEALTH_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 10 "http://excelsior.cards/health" || echo "HTTP_STATUS:000")
          
          # Extract HTTP status code
          HTTP_STATUS=$(echo "$HEALTH_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "📊 Health Check Results (attempt $((ATTEMPT+1))):"
          echo "========================"
          echo "HTTP Status Code: $HTTP_STATUS"
          echo ""
          echo "Response Body:"
          echo "$HEALTH_BODY" | jq . 2>/dev/null || echo "$HEALTH_BODY"
          echo ""
          
          # Check for specific error conditions
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️  Connection failed - server may not be responding or DNS issue"
          elif [ "$HTTP_STATUS" = "503" ]; then
            echo "⚠️  Service Unavailable - server may be starting or database connection issue"
            # Try to extract error message from response
            ERROR_MSG=$(echo "$HEALTH_BODY" | jq -r '.error // .database.error // "Unknown error"' 2>/dev/null || echo "Unknown error")
            echo "   Error details: $ERROR_MSG"
          elif [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️  Unexpected HTTP status: $HTTP_STATUS"
          fi
          
          echo "=========================================="
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check PASSED - Server is healthy"
            SUCCESS=1
            break
          else
            echo "❌ Health check FAILED - Server may not be ready (HTTP $HTTP_STATUS)"
          fi
          
          ATTEMPT=$((ATTEMPT+1))
        done
        
        if [ $SUCCESS -eq 1 ]; then
          exit 0
        else
          echo "❌ Health check FAILED after $((MAX_RETRIES+1)) attempts"
          echo "💡 Troubleshooting tips:"
          echo "   - Check if server is running: curl -I http://excelsior.cards"
          echo "   - Check server logs on EC2 instance"
          echo "   - Verify database connectivity"
          echo "   - Check DNS resolution for excelsior.cards"
          exit 1
        fi
        
    - name: Post-production verification complete
      run: |
        echo "✅ Post-production verification completed successfully!"
        echo "🌐 Production server is healthy and responding"
        echo "📊 Full health check details displayed above"
