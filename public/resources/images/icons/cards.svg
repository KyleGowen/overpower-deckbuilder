<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <!-- Neutral grays aligned with threat.png (matte silver gear) -->
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dde3"/>
      <stop offset="0.55" stop-color="#b8c0ca"/>
      <stop offset="1" stop-color="#9aa3ae"/>
    </linearGradient>
    <linearGradient id="cardFaceMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd4db"/>
      <stop offset="1" stop-color="#a8b0ba"/>
    </linearGradient>
    <linearGradient id="cardFaceFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e6eb"/>
      <stop offset="0.45" stop-color="#c5ccd4"/>
      <stop offset="1" stop-color="#a9b2bc"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
  </defs>

  <!-- Back (up-left) -->
  <g filter="url(#softShadow)">
    <rect x="9" y="3.5" width="8.5" height="11.5" rx="2.2" fill="url(#cardFace)"/>
  </g>
  <!-- Middle -->
  <g filter="url(#softShadow)">
    <rect x="6.5" y="5.5" width="8.5" height="11.5" rx="2.2" fill="url(#cardFaceMid)"/>
  </g>
  <!-- Front — blank face, small top slot only (no suit / symbol) -->
  <g filter="url(#softShadow)">
    <rect x="4" y="7.5" width="9" height="11.5" rx="2.2" fill="url(#cardFaceFront)"/>
    <rect x="7.1" y="8.35" width="2.8" height="1.1" rx="0.45" fill="rgba(60,68,78,0.35)"/>
  </g>
</svg>
