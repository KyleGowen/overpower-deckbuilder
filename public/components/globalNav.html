<!-- Global Navigation Component -->
<div class="unified-header">
    <div class="header-left">
        <img src="/src/resources/images/logo/logo5.png" alt="Excelsior Deckbuilder" class="header-logo" onclick="event.preventDefault(); event.stopPropagation(); return false;">
    </div>
    <div class="header-nav-cluster">
    <div class="header-center">
        <div class="header-app-actions">
            <div class="app-tabs">
                <button type="button" class="app-tab-button" id="databaseViewBtn" onclick="switchToDatabaseView()" title="Card Database" aria-label="Card Database">Database</button>
                <button type="button" class="app-tab-button active" id="deckBuilderBtn" onclick="switchToDeckBuilder()" title="Deck Builder" aria-label="Deck Builder">Decks</button>
                <button type="button" class="app-tab-button" id="collectionViewBtn" onclick="switchToCollectionView()" style="display: none;" title="Collection" aria-label="Collection">Collection</button>
            </div>
        </div>
    </div>
    <div class="header-right">
        <button id="newDeckBtn" class="new-deck-btn" onclick="createNewDeck()">+ Deck</button>
        <!-- Compatibility: legacy userWelcome span for older tests -->
        <span id="userWelcome" style="display:none">Welcome, <span id="currentUsernameHidden"></span>!</span>

        <div id="userMenu" class="user-menu">
            <button type="button" id="userMenuToggle" class="user-menu-toggle" onclick="toggleUserMenu(event)">
                <span id="currentUserGreeting" class="user-greeting">
                    <span class="user-greeting-copy">
                        <span class="user-greeting-line1">Welcome, </span>
                        <span class="user-greeting-line2"><span id="currentUsername"></span>!</span>
                    </span>
                    <span class="triangle-icon" aria-hidden="true">▶</span>
                </span>
            </button>
            <div id="userMenuDropdown" class="user-menu-dropdown">
                <!-- Items injected by JS based on role -->
            </div>
        </div>
        <!-- Hidden hooks for existing behaviors -->
        <div class="create-user-container" id="createUserContainer" style="display: none;">
            <div class="create-user-dropdown" id="createUserDropdown">
                <form id="createUserForm" onsubmit="createUser(event)">
                    <div class="form-group">
                        <label for="newUsername">Username:</label>
                        <input type="text" id="newUsername" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Password:</label>
                        <input type="password" id="newPassword" name="password" required autocomplete="new-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" class="cancel-btn" onclick="closeCreateUserDropdown()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Change Password dropdown (hidden by default) -->
        <div class="create-user-container" id="changePasswordContainer" style="display: none;">
            <div class="create-user-dropdown" id="changePasswordDropdown">
                <form id="changePasswordForm" onsubmit="changePassword(event)">
                    <!-- Hidden username field for accessibility (password managers, a11y) -->
                    <input type="text" name="username" id="changePasswordUsername" autocomplete="username" style="position:absolute;left:-9999px;width:1px;height:1px" tabindex="-1" aria-hidden="true">
                    <div class="form-group">
                        <label for="newPasswordField">New Password:</label>
                        <input type="password" id="newPasswordField" name="newPassword" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPasswordField">Confirm Password:</label>
                        <input type="password" id="confirmPasswordField" name="confirmPassword" required autocomplete="new-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" class="cancel-btn" onclick="closeChangePasswordDropdown()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
            <!-- Compatibility: legacy Create Deck button hook for tests -->
            <button id="createDeckBtn" class="create-deck-btn" onclick="createNewDeck()" style="display:none">+ Create Deck</button>
                <button id="logoutBtn" class="logout-btn" style="display:none">Log Out</button>
    </div>
    </div>
</div>
