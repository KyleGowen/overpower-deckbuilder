# Flyway config for the official Flyway Docker image (local dev).
# Inside the container, localhost is the Flyway container — not the host Postgres.
# overpower-postgres publishes 1337:5432 on the host; reach it via host.docker.internal.
flyway.url=jdbc:postgresql://host.docker.internal:1337/overpower
flyway.user=postgres
flyway.password=password
flyway.schemas=public
flyway.locations=filesystem:migrations
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=false
flyway.baselineVersion=0
flyway.baselineDescription=Initial baseline
